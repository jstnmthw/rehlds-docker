# =============================================================================
#  ReHLDS Counter-Strike 1.6 server  —  docker compose template (single server)
# =============================================================================
#  This is the SINGLE-SERVER template. `docker compose` reads docker-compose.yml
#  by default, which is gitignored — copy this into place first, then start:
#     cp docker-compose.example.yml docker-compose.yml
#     cp .env.example .env      # then edit .env (set RCON_PASSWORD!)
#     docker compose up -d --build
#
#  This file defines TOPOLOGY only — service name, container_name, volume and
#  image — and carries no ${...} interpolation. All runtime config lives in .env
#  (injected into the container via env_file). This server's data lives in
#  ./serverdata/default.
#
#  Upgrading an install whose data still lives directly in ./serverdata? Move it
#  under ./serverdata/default once, or the volume re-seeds empty (losing admins,
#  bans and the Reunion salt). A dir cannot be moved into its own subdirectory,
#  so go via a temp name:
#     docker compose down
#     mv serverdata serverdata.bak && mkdir serverdata && mv serverdata.bak serverdata/default
#     docker compose up -d
#
#  To run MULTIPLE servers from this one image, copy docker-compose.fleet.example.yml
#  to docker-compose.yml instead — one service, one env file and one
#  ./serverdata/<name> volume per server.
# =============================================================================

# -----------------------------------------------------------------------------
#  Shared service skeleton. Merged into each server with `<<: *csserver`, so the
#  single-server file here and the fleet example share one definition shape.
#  Topology only — no ${...}. It carries `image:` (not `build:`) so additional
#  servers reuse the one already-built image; the single `build:` lives on the
#  csserver service below.
# -----------------------------------------------------------------------------
x-csserver: &csserver
  image: rehlds-csserver:local

  # Host networking is the reliable choice for GoldSrc master-server
  # registration. The server binds these UDP ports directly on the host:
  #   UDP 27015  game traffic + A2S queries   (port-forward this; per-server SERVER_PORT)
  #   UDP 27005  client/RCON channel          (per-server CLIENT_PORT)
  #   UDP 26900  VAC
  network_mode: host

  restart: unless-stopped
  init: true                  # reap zombies (HLDS is the main process)
  stop_grace_period: 30s

  # Cap the per-container stdout log (HLDS console → Docker's json-file driver),
  # which is otherwise UNBOUNDED and grows for the life of the container. 10 MB ×
  # 3 files = 30 MB hard cap per server, so a busy fleet can't silently fill the
  # disk. The in-volume log files (cstrike/logs/, addons/amxmodx/logs/) are a
  # separate sink, bounded by LOG_RETENTION_DAYS in the env file.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

  # A2S-query healthcheck: confirms the server actually answers Steam queries
  # (the image also defines this; restated here for visibility). It keys off the
  # container's SERVER_PORT, so each server probes its own port.
  healthcheck:
    test: ["CMD", "/opt/cs16/healthcheck.sh"]
    interval: 60s
    timeout: 15s
    start_period: 90s
    retries: 3

services:
  csserver:
    <<: *csserver

    # The single `build:` lives here, not in the anchor, so additional servers
    # reuse the built image instead of racing to rebuild it. `docker compose
    # build` tags the result rehlds-csserver:local (the anchor's image:).
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # HLDS SteamCMD branch — keep steam_legacy (required for ReHLDS).
        STEAM_BRANCH: "steam_legacy"
        # Flip to "false" only if GitHub is unreachable at build time;
        # SHA256 verification always runs regardless.
        GPG_VERIFY: "true"

    container_name: rehlds-csserver

    # All runtime config lives in .env — injected into the container, no rebuild
    # needed to change it.
    env_file:
      - .env

    # The serverfiles volume. Seeded from the image's baked-in copy on first
    # run; persists maps, logs, admin lists and bans. Each server gets its own
    # host directory under ./serverdata/<name> — delete it to reset that server.
    volumes:
      - ./serverdata/default:/server

    # ---------------------------------------------------------------------
    # ALTERNATIVE to host networking: explicit port mappings. Less reliable
    # for GoldSrc master-server listing. Comment out `network_mode: host` (in
    # the x-csserver anchor above) before enabling this, and keep the published
    # ports in sync with this server's SERVER_PORT / CLIENT_PORT.
    # ---------------------------------------------------------------------
    # ports:
    #   - "27015:27015/udp"
    #   - "27005:27005/udp"
    #   - "26900:26900/udp"
