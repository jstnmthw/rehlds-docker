// =============================================================================
//  Team Fortress Classic  —  server.cfg  (ReHLDS edition)
// =============================================================================
//  This file is a TEMPLATE. On every container start, the entrypoint copies
//  it to  tfc/server.cfg  and appends a block of environment-driven
//  settings (hostname, rcon_password, sv_lan, sv_region, ...).
//
//  Do NOT edit tfc/server.cfg directly inside the container — it is
//  regenerated and your changes are lost. Instead:
//    * change runtime values in the server's env file, or
//    * put your own custom cvars in  tfc/server-custom.cfg  (a seeded file
//      that is exec'd last and is never overwritten).
//
//  The ReHLDS flood-protection, A2S, hardening, RCON, rate and logging sections
//  are identical across the image family (see config/cstrike/server.cfg);
//  only the gameplay block below is this game's.
// =============================================================================

// --- Basic server settings ---------------------------------------------------
// hostname / rcon_password / sv_password / sv_lan / sv_region are appended
// from the container environment — see the generated block at the bottom.
sv_contact ""
pausable 0
sv_cheats 0
sv_allowupload 1
sv_allowdownload 1
sv_voiceenable 1
mp_consistency 1

// Fast downloads: Serve your maps/models from an HTTP mirror instead of
// the slow in-game UDP download. Set SV_DOWNLOADURL in the env file — the
// entrypoint appends sv_downloadurl to the generated block below. Empty =
// clients fall back to the in-game UDP download.

// --- ReHLDS flood protection -------------------------------------------------
//  One of the things ReHLDS brings: it rate-limits the abusive packet types
//  that the classic GoldSrc A2S/stringcmd floods exploit, so a flood no longer
//  pegs a CPU core. These are sane starting values — raise them only if
//  legitimate clients are being limited (watch the console log).
sv_rehlds_stringcmdrate_max_avg 80
sv_rehlds_stringcmdrate_max_burst 400
sv_rehlds_movecmdrate_max_avg 400
sv_rehlds_movecmdrate_max_burst 2500
sv_rehlds_maxclients_from_single_ip 5

// --- A2S query rate limiting -------------------------------------------------
//  Caps how often a single IP can pull server-info ("TSource Engine Query" /
//  A2S_INFO) replies — the specific flood that motivated moving to ReHLDS.
//  These are the engine defaults, stated explicitly so the limit is visible
//  and tunable: per-IP queries/sec, the window it is measured over, and a
//  global server-wide cap.
sv_max_queries_sec 3.0
sv_max_queries_window 30
sv_max_queries_sec_global 60

// --- ReHLDS hardening / behaviour --------------------------------------------
sv_rehlds_send_mapcycle 0
sv_rehlds_hull_centering 0
sv_rehlds_local_gametime 0
sv_filterban 1

// --- RCON brute-force protection ---------------------------------------------
sv_rcon_minfailures 5
sv_rcon_maxfailures 10
sv_rcon_minfailuretime 30
sv_rcon_banpenalty 60

// --- Network rates -----------------------------------------------------------
//  Modernised for present-day broadband, the same values as the Counter-Strike
//  image. The old 25000 maxrate (the stock config even says 6000) throttles the
//  update rate this server allows (sv_maxupdaterate 102) — raising it lets good
//  connections actually receive the smoother feed. minrate / minupdaterate set
//  a sane floor so no client gets a choppy low-rate stream. Each client still
//  picks its own rate within these bounds. Set sv_maxrate 0 for a fully
//  uncapped rate. (The tick rate itself is a start parameter: EXTRA_START_PARAMS.)
sv_minrate 25000
sv_maxrate 100000
sv_minupdaterate 60
sv_maxupdaterate 102
sv_unlag 1
sv_maxunlag 0.5
sv_timeout 60
decalfrequency 30

// --- Gameplay (Team Fortress Classic) ---------------------------------------
//  Taken from the stock tfc/server.cfg the HLDS depot ships, plus the knobs the
//  AMX Mod X tfc add-on exposes in its cvars menu. No Counter-Strike cvars here.
sv_aim 0                  // no autoaim
sv_clienttrace 3.5        // player bounding boxes (collisions, not clipping)
sv_maxspeed 500           // TFC's stock movement cap (scouts, conc jumps)
mp_teamplay 21            // stock team-play flags
mp_timelimit 30
mp_fraglimit 0
mp_footsteps 1
mp_friendlyfire 0
allow_spectators 1
tfc_autoteam 0            // stock: players pick their team
// Clan-battle prematch is off, as stock:
//tfc_clanbattle 1
//tfc_clanbattle_prematch 2

// --- Bans ----------------------------------------------------------------------
// Load the ban lists AMX Mod X / writeid / writeip maintain in the volume.
exec listip.cfg
exec banned.cfg

// --- Logging (kept on; Docker captures stdout) -------------------------------
log on
mp_logfile 1
mp_logmessages 1
mp_logdetail 3
sv_logbans 1
sv_log_onefile 0
// These write a new log file into tfc/logs/ on every map change; AMX Mod X
// writes its own daily logs under addons/amxmodx/logs/. Nothing rotates them —
// they are pruned on start by LOG_RETENTION_DAYS (env file). The duplicate console
// stream goes to Docker stdout, capped by the compose `logging:` block.
// mp_logdetail 3 is verbose (logs every hit) — lower it if you don't run a
// stats parser and want smaller logs.
// Remote logging: to forward logs over UDP to another host (HLstatsX, a log
// monitor, ...), set LOG_ADDRESS in the env file — the entrypoint appends a
// `logaddress_add` line to the generated block below.

// --- Map cycle ---------------------------------------------------------------
mapchangecfgfile ""

// The container appends environment-driven settings below this line, and
// finishes with `exec server-custom.cfg` for your own custom cvars.
