; =============================================================================
;  Metamod plugin list  —  dod/addons/metamod/plugins.ini
; =============================================================================
;  This file is a TEMPLATE. On every container start, the entrypoint regenerates
;  dod/addons/metamod/plugins.ini from it:
;
;    * the line tagged @reunion@ is included only when REUNION_ENABLED=true
;    * a line tagged @bot@       is included only when BOTS_ENABLED=true
;      (dod has none: its bot is loaded by a start parameter, see below)
;
;  DO NOT edit the live dod/addons/metamod/plugins.ini inside the container —
;  it is regenerated on every start and your changes are lost. To toggle a
;  plugin, change REUNION_ENABLED / BOTS_ENABLED in your env file instead.
;
;  Format:  <os> <path-relative-to-gamedir>
; =============================================================================

; Reunion — lets non-Steam (protocol 47/48) clients connect. Loaded first.
;@reunion@ linux addons/reunion/reunion_mm_i386.so

; AMX Mod X — plugin platform (always enabled).
linux addons/amxmodx/dlls/amxmodx_mm_i386.so

; No @bot@ line: this game's bot, Marine Bot, is not a Metamod plugin. Metamod
; loads it as the game library through "+localinfo mm_gamedll
; marinebot/marinebot.so", which the entrypoint adds to the command line while
; BOTS_ENABLED=true, and Marine Bot loads dod/dlls/dod.so behind it.
; Tuning: marinebot/marine.cfg and marinebot/marine_dog-tags.txt.
